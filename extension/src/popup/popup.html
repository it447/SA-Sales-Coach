<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Deal Assistant</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 300px;
        padding: 1rem;
        background: #0a1628;
        color: #f5f0e8;
        margin: 0;
      }
      h1 { font-size: 15px; margin: 0 0 0.75rem; }
      .field { margin-bottom: 0.6rem; }
      label { display: block; color: #e8dcc8; font-size: 11px; margin-bottom: 0.2rem; }
      input {
        width: 100%;
        padding: 0.5rem;
        background: #1a2d4a;
        border: 1px solid #243550;
        border-radius: 6px;
        color: #f5f0e8;
        font-size: 12px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #e67e22;
        color: #0a1628;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        margin-top: 0.5rem;
      }
      button.secondary {
        background: transparent;
        color: #f5f0e8;
        border: 1px solid #1a2d4a;
      }
      p.muted { color: #8a9ab8; font-size: 11px; }
      p.status { font-size: 12px; }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0.75rem 0;
        padding: 0.5rem 0.6rem;
        background: #1a2d4a;
        border-radius: 6px;
      }
      .toggle-row span { font-size: 13px; font-weight: bold; }
      .toggle { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
      .toggle input { opacity: 0; width: 0; height: 0; }
      .toggle .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #243550;
        transition: 0.2s;
        border-radius: 24px;
      }
      .toggle .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #f5f0e8;
        transition: 0.2s;
        border-radius: 50%;
      }
      .toggle input:checked + .slider { background: #e74c3c; }
      .toggle input:checked + .slider:before { transform: translateX(20px); }
      .toggle input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div id="root">Loading…</div>
    <script type="module" src="../../dist/popup.js"></script>
  </body>
</html>
