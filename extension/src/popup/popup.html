<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Deal Assistant</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 300px;
        padding: 1rem;
        background: #0a1628;
        color: #f5f0e8;
        margin: 0;
      }
      h1 { font-size: 15px; margin: 0 0 0.75rem; }
      .field { margin-bottom: 0.6rem; }
      label { display: block; color: #e8dcc8; font-size: 11px; margin-bottom: 0.2rem; }
      input {
        width: 100%;
        padding: 0.5rem;
        background: #1a2d4a;
        border: 1px solid #243550;
        border-radius: 6px;
        color: #f5f0e8;
        font-size: 12px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        background: #e67e22;
        color: #0a1628;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        margin-top: 0.5rem;
      }
      button.secondary {
        background: transparent;
        color: #f5f0e8;
        border: 1px solid #1a2d4a;
      }
      p.muted { color: #8a9ab8; font-size: 11px; }
      p.status { font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root">Loading…</div>
    <script type="module" src="../../dist/popup.js"></script>
  </body>
</html>
